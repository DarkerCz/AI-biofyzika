mlp:
  hidden_layer_sizes: [128, 64, 32]
  max_iter: 400
  random_state: 42
  early_stopping: true
  validation_fraction: 0.15
  n_iter_no_change: 60
  epoch_delay: 0.2
  predict_delay: 1.2
  predict_batches: 50
