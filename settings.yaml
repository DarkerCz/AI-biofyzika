admin_password: "YouShallNotPass"

groups:
  1:
    name: "Skupina 1"
    password: "srdce"
    topic: "Diagnostika srdeční choroby"
    description: >
      Máte k dispozici klinická data pacientů (věk, pohlaví, typ bolesti na hrudi,
      cholesterol, tepová frekvence...). Natrénujte model na každém datasetu,
      předložte mu testovací pacienty a zjistěte, který model dává smysluplné předpovědi.
    target_column: "HeartDisease"
    correct_dataset: "C"
    dataset_corruptions:
      A: "shuffled"
      B: "inverted"
      C: "correct"
      D: "partial"
    positive_label: "S chorobou"
    negative_label: "Bez choroby"
    display_columns: ["Age", "Sex", "ChestPainType", "RestingBP", "Cholesterol", "MaxHR", "ExerciseAngina"]
    data_source: "Fedesoriano (2021). Heart Failure Prediction Dataset. Kaggle. https://www.kaggle.com/datasets/fedesoriano/heart-failure-prediction — kombinace 5 UCI databází, 918 pacientů"
    column_descriptions:
      Age: "věk pacienta v letech — age (years)"
      Sex: "pohlaví — sex: 0 = žena (F), 1 = muž (M)"
      ChestPainType: "typ bolesti na hrudi — chest pain type: 1 = TA (typická angina), 2 = ATA (atypická), 3 = NAP (neangionózní), 4 = ASY (asymptomatický)"
      RestingBP: "klidový krevní tlak — resting blood pressure (mmHg)"
      Cholesterol: "sérový cholesterol — serum cholesterol (mg/dl)"
      FastingBS: "glykémie nalačno > 120 mg/dl — fasting blood sugar: 0 = ne, 1 = ano"
      RestingECG: "klidové EKG — resting ECG: 0 = Normal, 1 = ST (abnormality ST-T), 2 = LVH (hypertrofie levé komory)"
      MaxHR: "maximální dosažená tepová frekvence — maximum heart rate achieved (tepů/min)"
      ExerciseAngina: "angina při zátěži — exercise-induced angina: 0 = ne (N), 1 = ano (Y)"
      Oldpeak: "pokles ST segmentu při zátěži — ST depression (mm)"
      ST_Slope: "sklon ST segmentu — slope: 1 = Up (stoupající), 2 = Flat (plochý), 3 = Down (klesající)"
      HeartDisease: "přítomnost srdeční choroby — heart disease: 0 = ne, 1 = ano"

  2:
    name: "Skupina 2"
    password: "cukr"
    topic: "Diagnostika diabetu"
    description: >
      Máte k dispozici biochemická data pacientek (glukóza, BMI, inzulin,
      krevní tlak, věk...). Natrénujte model na každém datasetu, předložte mu
      testovací pacientky a zjistěte, který model dává smysluplné předpovědi.
    target_column: "Outcome"
    correct_dataset: "D"
    dataset_corruptions:
      A: "inverted"
      B: "partial"
      C: "shuffled"
      D: "correct"
    positive_label: "Diabetes"
    negative_label: "Bez diabetu"
    display_columns: ["Age", "Glucose", "BMI", "BloodPressure", "Insulin", "Pregnancies"]
    data_source: "Smith et al. (1988). Pima Indians Diabetes Database. UCI / Kaggle. https://www.kaggle.com/datasets/uciml/pima-indians-diabetes-database"
    column_descriptions:
      Pregnancies: "počet těhotenství — number of times pregnant"
      Glucose: "koncentrace glukózy v plazmě 2 hodiny po orálním glukózovém tolerančním testu — plasma glucose concentration (mg/dl)"
      BloodPressure: "diastolický krevní tlak — diastolic blood pressure (mmHg)"
      SkinThickness: "tloušťka kožní řasy tricepsu — triceps skin fold thickness (mm)"
      Insulin: "2-hodinová hladina inzulinu v séru — 2-hour serum insulin (μU/ml)"
      BMI: "index tělesné hmotnosti = hmotnost/výška² — Body Mass Index (kg/m²)"
      DiabetesPedigreeFunction: "funkce genetického rizika diabetu — diabetes pedigree function (0.0–2.5)"
      Age: "věk pacientky v letech — age (years)"
      Outcome: "přítomnost diabetu: 0 = ne, 1 = ano — class variable"

  3:
    name: "Skupina 3"
    password: "prsa"
    topic: "Diagnostika rakoviny prsu"
    description: >
      Máte k dispozici parametry biopsie nádoru (průměrný poloměr, textura,
      obvod, plocha, hladkost...). Natrénujte model na každém datasetu,
      předložte mu testovací vzorky a zjistěte, který model dává smysluplné předpovědi.
    target_column: "diagnosis"
    correct_dataset: "B"
    dataset_corruptions:
      A: "partial"
      B: "correct"
      C: "shuffled"
      D: "inverted"
    positive_label: "Maligní"
    negative_label: "Benigní"
    display_columns: ["mean radius", "mean texture", "mean perimeter", "mean area", "mean smoothness"]
    data_source: "Street et al. (1993). Breast Cancer Wisconsin (Diagnostic). UCI / scikit-learn. https://archive.ics.uci.edu/dataset/17/breast+cancer+wisconsin+diagnostic"
    column_descriptions:
      "mean radius": "střední poloměr buněk — mean of distances from center to points on perimeter (mm)"
      "mean texture": "střední textura — mean standard deviation of gray-scale values"
      "mean perimeter": "střední obvod buněk — mean perimeter (mm)"
      "mean area": "střední plocha buněk — mean area (mm²)"
      "mean smoothness": "střední hladkost — mean local variation in radius lengths"
      "mean compactness": "střední kompaktnost — mean perimeter²/area − 1.0"
      "mean concavity": "střední konkavita — mean severity of concave portions of contour"
      "mean concave points": "střední počet konkávních bodů — mean number of concave portions of contour"
      "mean symmetry": "střední symetrie — mean symmetry"
      "mean fractal dimension": "střední fraktální dimenze — mean fractal dimension (coastline approximation − 1)"
      "radius error": "chyba poloměru — SE of radius"
      "texture error": "chyba textury — SE of texture"
      "perimeter error": "chyba obvodu — SE of perimeter"
      "area error": "chyba plochy — SE of area"
      "smoothness error": "chyba hladkosti — SE of smoothness"
      "compactness error": "chyba kompaktnosti — SE of compactness"
      "concavity error": "chyba konkavity — SE of concavity"
      "concave points error": "chyba konkávních bodů — SE of concave points"
      "symmetry error": "chyba symetrie — SE of symmetry"
      "fractal dimension error": "chyba fraktální dimenze — SE of fractal dimension"
      "worst radius": "maximální poloměr — worst (largest) radius"
      "worst texture": "maximální textura — worst texture"
      "worst perimeter": "maximální obvod — worst perimeter"
      "worst area": "maximální plocha — worst area"
      "worst smoothness": "maximální nehladkost — worst smoothness"
      "worst compactness": "maximální nekompaktnost — worst compactness"
      "worst concavity": "maximální konkavita — worst concavity"
      "worst concave points": "maximální konkávní body — worst concave points"
      "worst symmetry": "maximální asymetrie — worst symmetry"
      "worst fractal dimension": "maximální fraktální dimenze — worst fractal dimension"
      diagnosis: "diagnóza nádoru: M = maligní, B = benigní (v datasetu binarizováno)"

  4:
    name: "Skupina 4"
    password: "infarkt"
    topic: "Prognóza přežití po srdečním selhání"
    description: >
      Máte k dispozici klinická data pacientů se srdečním selháním (ejekční frakce,
      hladina kreatininu, věk, sodík, čas sledování...). Natrénujte model na každém
      datasetu a zjistěte, který model lépe predikuje mortalitu.
    target_column: "DEATH_EVENT"
    correct_dataset: "A"
    dataset_corruptions:
      A: "correct"
      B: "shuffled"
      C: "partial"
      D: "inverted"
    positive_label: "Zemřel"
    negative_label: "Přežil"
    display_columns: ["age", "ejection_fraction", "serum_creatinine", "serum_sodium", "time", "diabetes"]
    data_source: "Chicco & Jurman (2020). BMC Medical Informatics and Decision Making. UCI Heart Failure Clinical Records. https://archive.ics.uci.edu/dataset/519/heart+failure+clinical+records"
    column_descriptions:
      age: "věk pacienta v letech — age (years)"
      anaemia: "snížená hladina červených krvinek nebo hemoglobinu — anaemia: 0 = ne, 1 = ano"
      creatinine_phosphokinase: "hladina enzymu CPK v krvi — creatinine phosphokinase (U/l)"
      diabetes: "přítomnost diabetes mellitus — diabetes: 0 = ne, 1 = ano"
      ejection_fraction: "ejekční frakce levé komory — ejection fraction (%); normální ≥ 55 %"
      high_blood_pressure: "hypertenze — high blood pressure: 0 = ne, 1 = ano"
      platelets: "trombocyty — platelets (kiloplatelets/ml)"
      serum_creatinine: "sérový kreatinin — serum creatinine (mg/dl); ukazatel funkce ledvin"
      serum_sodium: "sérový sodík — serum sodium (mEq/l); hyponatrémie = nepříznivý znak"
      sex: "pohlaví — sex: 0 = žena, 1 = muž"
      smoking: "kuřák — smoking: 0 = ne, 1 = ano"
      time: "délka sledování po propuštění — follow-up period (dny)"
      DEATH_EVENT: "exitus v době sledování — death event: 0 = přežil, 1 = zemřel"

  5:
    name: "Skupina 5"
    password: "nemocnice"
    topic: "Prognóza readmise do nemocnice"
    description: >
      Máte k dispozici data o propuštěných diabetických pacientech (délka hospitalizace,
      HbA1c, počet urgentních příjmů, glukóza, kreatinin...). Natrénujte model na každém
      datasetu a zjistěte, který model lépe predikuje readmisi do 30 dnů.
    target_column: "readmitted_30"
    correct_dataset: "D"
    dataset_corruptions:
      A: "inverted"
      B: "shuffled"
      C: "partial"
      D: "correct"
    positive_label: "Readmitován"
    negative_label: "Nereadmitován"
    display_columns: ["vek", "delka_hospitalizace", "HbA1c", "pocet_urgentni_prijmu", "glukoza", "BMI"]
    data_source: "Syntetická data inspirovaná: Strack et al. (2014). Impact of HbA1c Measurement on Hospital Readmission Rates. BioMed Research International. https://doi.org/10.1155/2014/781670"
    column_descriptions:
      vek: "věk pacienta v letech — age (years)"
      delka_hospitalizace: "délka poslední hospitalizace — time in hospital (days)"
      pocet_urgentni_prijmu: "počet urgentních příjmů za poslední rok — number of emergency visits"
      pocet_leku: "počet pravidelně užívaných léků — number of medications"
      HbA1c: "glykovaný hemoglobin — HbA1c (%); ukazatel kompenzace diabetu, normální < 7 %"
      glukoza: "glukóza při přijetí — glucose level (mg/dl)"
      BMI: "index tělesné hmotnosti — Body Mass Index (kg/m²)"
      pocet_diagnoz: "počet přidružených diagnóz — number of diagnoses"
      kreatinin: "sérový kreatinin — serum creatinine (mg/dl)"
      readmitted_30: "readmise do 30 dnů od propuštění: 0 = ne, 1 = ano"

  6:
    name: "Skupina 6"
    password: "sepse"
    topic: "Prognóza těžkého průběhu sepse"
    description: >
      Máte k dispozici klinická data pacientů se sepsí (SOFA skóre, laktát,
      MAP, kreatinin, teplota, věk...). Natrénujte model na každém datasetu
      a zjistěte, který model lépe predikuje komplikovaný průběh.
    target_column: "SepsisLabel"
    correct_dataset: "C"
    dataset_corruptions:
      A: "partial"
      B: "inverted"
      C: "correct"
      D: "shuffled"
    positive_label: "Komplikovaný průběh"
    negative_label: "Nekomplikovaný průběh"
    display_columns: ["vek", "SOFA", "Laktat", "MAP", "Kreatinin", "Temp", "SpO2"]
    data_source: "Syntetická data inspirovaná: Reyna et al. (2020). Early Prediction of Sepsis from Clinical Data. PhysioNet Computing in Cardiology Challenge 2019. https://physionet.org/content/challenge-2019/"
    column_descriptions:
      SF: "srdeční frekvence — heart rate (/min)"
      SpO2: "saturace hemoglobinu kyslíkem, pulzní oxymetrie — SpO2 (%); normální > 95 %"
      Temp: "tělesná teplota — temperature (°C)"
      MAP: "střední arteriální tlak — Mean Arterial Pressure (mmHg); < 65 = septický šok"
      Resp: "dechová frekvence — respiratory rate (/min)"
      Laktat: "laktát v séru — serum lactate (mmol/l); > 2 = tkáňová hypoxie"
      WBC: "leukocyty — White Blood Cells (G/l)"
      Kreatinin: "sérový kreatinin — serum creatinine (mg/dl)"
      Bilirubin: "sérový bilirubin — serum bilirubin (mg/dl)"
      SOFA: "skóre selhání orgánů — Sequential Organ Failure Assessment (0–24); ≥ 2 = sepse"
      vek: "věk pacienta v letech — age (years)"
      SepsisLabel: "těžký průběh sepse: 0 = nekomplikovaný, 1 = komplikovaný"

mlp:
  hidden_layer_sizes: [128, 64, 32]
  max_iter: 400
  random_state: 42
  early_stopping: true
  validation_fraction: 0.15
  n_iter_no_change: 60
  epoch_delay: 0 #0.5
  predict_delay: 0 #1.2
  predict_batches: 25
