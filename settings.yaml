      "mean area": "Průměrná plocha buněk nádoru (mm²)"
      "mean smoothness": "Hladkost povrchu: lokální odchylka délky poloměru buněk"

  4:
    name: "Skupina 4"
    password: "infarkt"
    topic: "Prognóza přežití po srdečním selhání"
